<!--
  Three ways to give a page its Firestore config. Pass Burrow.readBackendConfig() to burrow()
  to use the <meta> tag (read first) or window.BURROW; bundler users can pass a backend
  explicitly. burrow() never reads the page by itself, and always needs a token too. Create
  your own project (see docs/firestore-setup.md) and paste its three values below.
  Do not reuse the values in demo/index.html: they belong to the maintainer's demo project.
  The apiKey is an identifier, not a secret; restrict it in the Google Cloud console to the
  Cloud Firestore API and to the domains you deploy to.
-->

<!-- Option A: meta tag -->
<meta
  name="burrow-firestore"
  content='{"apiKey":"YOUR_API_KEY","projectId":"your-project-id","appId":"YOUR_APP_ID"}'
/>

<!-- Option B: global, for sites that prefer config in script -->
<script>
  window.BURROW = {
    firestore: {
      apiKey: "YOUR_API_KEY",
      projectId: "your-project-id",
      appId: "YOUR_APP_ID",
    },
  };
</script>

<!-- Option C: bundler users pass it explicitly -->
<script type="module">
  import { burrow } from "burrow-storage";
  import { FirestoreBackend } from "burrow-storage/firestore";
  const store = await burrow({
    app: "my-prototype",
    backend: new FirestoreBackend({
      apiKey: "YOUR_API_KEY",
      projectId: "your-project-id",
      appId: "YOUR_APP_ID",
    }),
    token, // from generateToken(), a passkey, or the user
  });
</script>
