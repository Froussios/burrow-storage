name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing and provenance (SEC-6, D-53)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: npm with staged publishing
        run: npm install -g npm@^11.21.0
      - run: npm ci
      - run: mkdir -p node_modules/.cache
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: set -o pipefail; npm run size | tee size.txt
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: SRI hashes
        run: node scripts/sri.mjs | tee sri-tags.html
      # Stages the version on npm; the owner approves it with 2FA (npm stage approve or the
      # website) before it becomes public (D-53).
      - name: Stage on npm with provenance
        run: npm stage publish --provenance --access public
      # A draft until the owner approves the staged version and publishes it (D-53).
      - name: GitHub release with bundles and SRI
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo '## Script tag (SRI)'; echo; echo '```html'; cat sri-tags.html; echo '```'; echo;
            echo '## Bundle sizes (min+gzip)'; echo; echo '```'; grep -E '^(ok|FAIL) ' size.txt; echo '```'; echo;
            echo 'See CHANGELOG.md.'; } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft dist/burrow.min.js dist/burrow-firestore.js dist/sri.json --notes-file notes.md
