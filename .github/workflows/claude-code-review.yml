name: Claude Code Review

# Reviews PRs from people with write access (in practice, the owner) with the
# pr-review skill (.claude/skills/pr-review/SKILL.md) when they become ready
# for review, and again after a push that follows a blocking verdict. A
# "no blocking issues" verdict approves the reviewed commit; any later push
# withdraws that approval (mark the PR draft and ready again for a fresh
# review). Other PRs, including all PRs from forks, skip every job, so they
# start no runner, use no Claude quota and are never approved.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    if: >-
      !github.event.pull_request.draft &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to withdraw stale approvals
    outputs:
      review: ${{ steps.decide.outputs.review }}
    steps:
      - name: Review now?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_ACTION" != synchronize ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # New commits: an earlier approval no longer covers the PR.
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id'); do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$id/dismissals" \
              -f message="New commits since this approval." -f event=DISMISS >/dev/null \
              || echo "::warning::Could not withdraw approval $id"
          done
          # Re-review only if the latest verdict was blocking.
          verdict=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .body
                  | capture("\\*\\*Verdict:\\*\\* (?<v>blocking|no blocking issues)")?
                  | .v' | tail -n 1)
          echo "Latest verdict: ${verdict:-none}"
          if [ "$verdict" = blocking ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
          fi

  claude-review:
    needs: decide
    if: needs.decide.outputs.review == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # The review and its verdict must follow the base branch's instructions,
      # not ones the PR supplies. Claude Code loads CLAUDE.md files, .claude/
      # (skills, settings, hooks) and .mcp.json from the checkout, so replace
      # them all with the base branch's versions.
      - name: Use the base branch's Claude configuration
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          find . -path ./.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md \
            -o -name .mcp.json -o -name .claude \) -prune -exec rm -rf {} +
          git ls-tree -r --name-only "$BASE" \
            | grep -E '(^|/)(CLAUDE\.md|CLAUDE\.local\.md|\.mcp\.json)$|(^|/)\.claude/' \
            | xargs -r git checkout "$BASE" --

      - name: Note the start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # #37: subagents started in the background were abandoned when the
          # main turn ended, so nothing was posted. Keep them in the
          # foreground.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # One tracking comment that Claude fills in, as for an @claude
          # mention.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request with the pr-review skill. Read
            .claude/skills/pr-review/SKILL.md first and follow it. Write the
            review in your tracking comment.
          # Opus runs the review. Read-only access, plus /tmp for notes (such
          # as a saved diff), which is outside the checkout, and Claude's own
          # tool-results folder, where large diffs land. Nothing that can
          # edit the repo or run other programs: the action's app token can
          # write to the repo.
          claude_args: >-
            --model opus
            --add-dir /home/runner/.claude/projects
            --add-dir /tmp
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(tr:*),Bash(cut:*),Edit(//tmp/**)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Read the verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.start.outputs.at }}
        run: |
          verdict=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "claude[bot]" and .created_at >= env.STARTED) | .body
                  | capture("\\*\\*Verdict:\\*\\* (?<v>blocking|no blocking issues)")?
                  | .v' | tail -n 1)
          echo "Verdict: ${verdict:-none}"
          [ -n "$verdict" ] || echo "::warning::The review comment has no verdict line"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

  # A separate job, without Claude or a checkout, holds the only token that can
  # approve.
  approve:
    needs: claude-review
    if: needs.claude-review.outputs.verdict == 'no blocking issues'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f commit_id="$SHA" -f event=APPROVE \
            -f body="Claude's review found no blocking issues; see its review comment." >/dev/null
