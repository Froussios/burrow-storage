name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck, unit, property, conformance, build, size
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: mkdir -p node_modules/.cache
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm run docs:check

  rules:
    name: Firestore rules + adapter conformance (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci
      - run: npm ci
        working-directory: firebase/tests
      - run: npm run test:rules
      - run: npm run test:firestore

  e2e:
    name: Browsers (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" } # the Firestore emulator
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e
      - name: Demo smoke checks against the assembled site/ (page; Firestore on the emulator)
        run: npm run demo:build && node scripts/emulator.mjs "npm run test:smoke"
        env: { BURROW_DEMO_COMMIT: "${{ github.sha }}" }
