name: Demo (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy and its smoke test at a time, so each smoke test sees its own deploy (#24, D-40).
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Assemble site/ (demo + bundles on one origin, stamped with this commit)
        run: npm run demo:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test the deployed demo
    needs: deploy
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      BURROW_DEMO_URL: ${{ needs.deploy.outputs.url }}
      BURROW_DEMO_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Both wait for the page to show this commit. One step per thing checked
      # (D-41), so a red run says which; a second backend adds its own step.
      - name: "Page: this commit, strict CSP, connects only where the CSP allows, shows a token"
        run: npm run test:smoke -- --project=page
      - name: "Firestore: the Firebase project burrow-storage-shared takes writes under the Burrow rules and syncs two devices"
        if: ${{ !cancelled() }}
        run: npm run test:smoke -- --project=firestore
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: smoke-traces, path: test-results, retention-days: 14 }
